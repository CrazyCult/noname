name: Crawl Progressions MONTH

on:
  schedule:
    - cron: '15 16 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

# Shared queue: this crawl waits rather than calling MFL alongside another one.
concurrency:
  group: progression-crawl
  cancel-in-progress: false

jobs:
  crawl-progressions-month:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Crawling

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Crawl Progressions MONTH
        run: npm run crawl:progressions MONTH
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MFL_API_URL: ${{ secrets.MFL_API_URL }}
