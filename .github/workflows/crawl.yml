name: Daily Crawl

on:
  schedule:
    - cron: '30 10 * * *'
      timezone: 'Europe/Paris'
    - cron: '10 23 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

concurrency:
  group: daily-progression-crawl
  cancel-in-progress: false

jobs:
  crawl-24h:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Crawling

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Crawl progressions 24H
        run: npm run crawl:progressions 24H
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MFL_API_URL: ${{ secrets.MFL_API_URL }}

  predictions:
    needs: crawl-24h
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: Crawling

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Refresh predictions
        run: npm run predict:progressions
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
