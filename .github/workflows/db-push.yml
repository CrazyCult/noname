name: DB migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/db/schema.ts'
      - '.github/workflows/db-push.yml'

jobs:
  db-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Crawling

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Drizzle's schema push is blocked by an old, unrelated crawl_logs primary-key
      # mismatch. Keep migrations explicit and idempotent so a failed unrelated table
      # can never take the player list offline.
      - name: Add official retirement field
        run: |
          node <<'NODE'
          const mysql = require('mysql2/promise');

          async function migrate() {
            const config = {
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              port: Number(process.env.DB_PORT) || 3306,
            };

            if (config.host?.includes('tidbcloud')) {
              config.ssl = { rejectUnauthorized: true };
            }

            const connection = await mysql.createConnection(config);
            try {
              const [columns] = await connection.query(
                `SELECT 1
                 FROM information_schema.columns
                 WHERE table_schema = DATABASE()
                   AND table_name = 'players'
                   AND column_name = 'retirement_years'
                 LIMIT 1`,
              );

              if (columns.length === 0) {
                await connection.query(
                  'ALTER TABLE \`players\` ADD COLUMN \`retirement_years\` INT NULL AFTER \`age\`',
                );
                console.log('Added players.retirement_years.');
              } else {
                console.log('players.retirement_years already exists.');
              }

              const [retiredColumns] = await connection.query(
                `SELECT 1
                 FROM information_schema.columns
                 WHERE table_schema = DATABASE()
                   AND table_name = 'players'
                   AND column_name = 'is_retired'
                 LIMIT 1`,
              );

              if (retiredColumns.length === 0) {
                await connection.query(
                  'ALTER TABLE \`players\` ADD COLUMN \`is_retired\` BOOLEAN NOT NULL DEFAULT FALSE AFTER \`is_dev_center\`',
                );
                console.log('Added players.is_retired.');
              } else {
                console.log('players.is_retired already exists.');
              }

              const [retiredIndexes] = await connection.query(
                `SELECT 1
                 FROM information_schema.statistics
                 WHERE table_schema = DATABASE()
                   AND table_name = 'players'
                   AND index_name = 'is_retired_idx'
                 LIMIT 1`,
              );

              if (retiredIndexes.length === 0) {
                await connection.query(
                  'CREATE INDEX \`is_retired_idx\` ON \`players\` (\`is_retired\`)',
                );
                console.log('Added players.is_retired index.');
              }

              const [lastSeenColumns] = await connection.query(
                `SELECT 1
                 FROM information_schema.columns
                 WHERE table_schema = DATABASE()
                   AND table_name = 'players'
                   AND column_name = 'last_seen_at'
                 LIMIT 1`,
              );

              if (lastSeenColumns.length === 0) {
                await connection.query(
                  'ALTER TABLE \`players\` ADD COLUMN \`last_seen_at\` TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP AFTER \`is_retired\`',
                );
                console.log('Added players.last_seen_at.');
              }

              const [lastSeenIndexes] = await connection.query(
                `SELECT 1
                 FROM information_schema.statistics
                 WHERE table_schema = DATABASE()
                   AND table_name = 'players'
                   AND index_name = 'last_seen_at_idx'
                 LIMIT 1`,
              );

              if (lastSeenIndexes.length === 0) {
                await connection.query(
                  'CREATE INDEX \`last_seen_at_idx\` ON \`players\` (\`last_seen_at\`)',
                );
                console.log('Added players.last_seen_at index.');
              }
            } finally {
              await connection.end();
            }
          }

          migrate().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
