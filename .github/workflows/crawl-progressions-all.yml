name: Crawl Progressions ALL

on:
  schedule:
    - cron: '0 18 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

# Shared queue: this crawl waits rather than calling MFL alongside another one.
concurrency:
  group: progression-crawl
  cancel-in-progress: false

jobs:
  crawl-progressions-all:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Crawling

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test DB connection
        run: |
          node -e "
          const mysql = require('mysql2/promise');
          async function test() {
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              port: Number(process.env.DB_PORT),
              ssl: { rejectUnauthorized: true }
            });
            const [rows] = await conn.execute('SELECT 1 as ok');
            console.log('✅ DB connected:', rows[0]);
            await conn.end();
          }
          test().catch(e => { console.error('❌ DB error:', e.message, '| code:', e.code, '| host:', process.env.DB_HOST, '| port:', process.env.DB_PORT, '| user:', process.env.DB_USER, '| db:', process.env.DB_NAME); process.exit(1); });
          "
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - name: Crawl Progressions ALL
        run: npm run crawl:progressions ALL
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MFL_API_URL: ${{ secrets.MFL_API_URL }}
