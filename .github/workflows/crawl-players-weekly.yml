name: Weekly Crawl Players

on:
  schedule:
    - cron: '0 3 * * 4'
      timezone: 'Europe/Paris'
  workflow_dispatch:

concurrency:
  group: player-index-and-snapshots
  cancel-in-progress: false

jobs:
  crawl-players-weekly:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Crawling

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test DB connection
        run: |
          node -e "
          const mysql = require('mysql2/promise');
          async function test() {
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              port: Number(process.env.DB_PORT),
              ssl: { rejectUnauthorized: true }
            });
            const [rows] = await conn.execute('SELECT 1 as ok');
            console.log('✅ DB connected:', rows[0]);
            await conn.end();
          }
          test().catch(e => { console.error('❌ DB error:', e.message); process.exit(1); });
          "
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - id: baseline
        name: Remember newest player ID before indexation
        run: |
          node - <<'NODE'
          const mysql = require('mysql2/promise');
          const { appendFileSync } = require('node:fs');

          async function main() {
            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              port: Number(process.env.DB_PORT),
              ssl: { rejectUnauthorized: true },
            });
            const [rows] = await connection.query('SELECT COALESCE(MAX(id), 0) AS maxPlayerId FROM players');
            await connection.end();

            const maxPlayerId = Number(rows[0].maxPlayerId);
            appendFileSync(process.env.GITHUB_OUTPUT, `max_player_id=${maxPlayerId}\n`);
            console.log(`[Players] New history backfill will start after player ID ${maxPlayerId}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - name: Crawl Players (weekly)
        run: npm run crawl:players
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MFL_API_URL: ${{ secrets.MFL_API_URL }}

      - name: Store absolute player snapshots
        run: npm run crawl:snapshots
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
      - name: Derive week, month, season and total progressions
        run: npm run derive:progressions
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
      - id: latest
        name: Read newest player ID after indexation
        run: |
          node - <<'NODE'
          const mysql = require('mysql2/promise');
          const { appendFileSync } = require('node:fs');

          async function main() {
            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              port: Number(process.env.DB_PORT),
              ssl: { rejectUnauthorized: true },
            });
            const [rows] = await connection.query('SELECT COALESCE(MAX(id), 0) AS maxPlayerId FROM players');
            await connection.end();

            appendFileSync(process.env.GITHUB_OUTPUT, `max_player_id=${Number(rows[0].maxPlayerId)}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - name: Backfill newly indexed players
        if: steps.latest.outputs.max_player_id != steps.baseline.outputs.max_player_id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run crawl-history.yml --ref main \
            -f start_after_id="${{ steps.baseline.outputs.max_player_id }}" \
            -f max_players="4000" \
            -f delay_ms="700" \
            -f chain=true

