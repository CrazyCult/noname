name: Backfill Player History

on:
  workflow_dispatch:
    inputs:
      start_after_id:
        description: Resume after this player ID (use the value printed by the previous run)
        required: false
        default: '0'
      max_players:
        description: Players to process in this run (maximum 15000)
        required: false
        default: '1000'
      delay_ms:
        description: Minimum interval between MFL requests in milliseconds (minimum 700)
        required: false
        default: '250'
      workers:
        description: Parallel workers sharing one adaptive global limiter (maximum 8)
        required: false
        default: '4'
      max_runtime_minutes:
        description: Stop cleanly before the GitHub timeout and queue the next batch
        required: false
        default: '60'
      chain:
        description: Automatically queue the next batch after a successful run
        required: false
        type: boolean
        default: false

concurrency:
  group: history-backfill
  cancel-in-progress: false

jobs:
  history:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: Crawling
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: history
        run: npm run crawl:history
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MFL_API_URL: ${{ secrets.MFL_API_URL }}
          HISTORY_START_AFTER_ID: ${{ inputs.start_after_id }}
          HISTORY_MAX_PLAYERS: ${{ inputs.max_players }}
          HISTORY_DELAY_MS: ${{ inputs.delay_ms }}
          HISTORY_WORKERS: ${{ inputs.workers }}
          HISTORY_MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}

      - name: Refresh predictions after the full backfill
        if: success() && steps.history.outputs.has_more == 'false'
        run: npm run predict:progressions
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - name: Queue next history batch
        if: success() && inputs.chain && steps.history.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run crawl-history.yml --ref "${{ github.ref_name }}" \
            -f start_after_id="${{ steps.history.outputs.next_start_after_id }}" \
            -f max_players="${{ inputs.max_players }}" \
            -f delay_ms="${{ inputs.delay_ms }}" \
            -f workers="${{ inputs.workers }}" \
            -f max_runtime_minutes="${{ inputs.max_runtime_minutes }}" \
            -f chain=true
