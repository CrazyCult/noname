name: Daily Player Snapshot

on:
  schedule:
    # Thursday is handled by the weekly player crawl, which also derives periods.
    - cron: '0 4 * * 0-3,5-6'
      timezone: 'Europe/Paris'
  workflow_dispatch:

# A full player index supplies the absolute state used by snapshots.
concurrency:
  group: player-index-and-snapshots
  cancel-in-progress: false

jobs:
  refresh-player-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: Crawling

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Refresh current player states
        run: npm run crawl:players
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          MFL_API_URL: ${{ secrets.MFL_API_URL }}

      - name: Store absolute player snapshots
        run: npm run crawl:snapshots
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - name: Derive week, month, season and total progressions
        run: npm run derive:progressions
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
